name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: .servercraft-build/frontend
        run: yarn install

      - name: Build frontend
        working-directory: .servercraft-build/frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: false
        run: yarn build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .servercraft-build/backend/requirements.txt
          pip install pyinstaller

      - name: Prepare for PyInstaller
        shell: pwsh
        run: |
          # Copy frontend build into backend for bundling
          New-Item -ItemType Directory -Force -Path .servercraft-build/backend/static
          Copy-Item -Recurse .servercraft-build/frontend/build/* .servercraft-build/backend/static/
          
          # Create directories for data
          New-Item -ItemType Directory -Force -Path .servercraft-build/backend/data
          "{}" | Out-File -Encoding UTF8 .servercraft-build/backend/data/servers.json
          "{}" | Out-File -Encoding UTF8 .servercraft-build/backend/data/config.json

      - name: Build EXE with PyInstaller
        working-directory: .servercraft-build/backend
        shell: pwsh
        run: |
          pyinstaller --onefile --name ServerCraft --console `
            --add-data "static;static" `
            --add-data "managers;managers" `
            --add-data "data;data" `
            --hidden-import uvicorn `
            --hidden-import uvicorn.main `
            --hidden-import uvicorn.config `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import fastapi `
            --hidden-import fastapi.applications `
            --hidden-import fastapi.routing `
            --hidden-import psutil `
            --hidden-import psutil._pswindows `
            --hidden-import psutil._common `
            --hidden-import miniupnpc `
            --hidden-import aiofiles `
            --hidden-import aiofiles.os `
            --hidden-import websockets `
            --hidden-import h11 `
            --hidden-import httptools `
            --hidden-import starlette `
            --hidden-import starlette.applications `
            --hidden-import starlette.routing `
            --hidden-import starlette.middleware `
            --hidden-import starlette.middleware.cors `
            --hidden-import starlette.responses `
            --hidden-import starlette.staticfiles `
            --hidden-import starlette.websockets `
            --hidden-import anyio `
            --hidden-import anyio._core `
            --hidden-import anyio._backends `
            --hidden-import anyio._backends._asyncio `
            --hidden-import pydantic `
            --hidden-import pydantic.fields `
            --hidden-import pydantic.main `
            --hidden-import pydantic_core `
            --hidden-import typing_extensions `
            --hidden-import dotenv `
            --hidden-import python_dotenv `
            --hidden-import bs4 `
            --hidden-import soupsieve `
            --hidden-import click `
            --hidden-import json `
            --hidden-import logging `
            --hidden-import asyncio `
            --hidden-import concurrent `
            --hidden-import concurrent.futures `
            --hidden-import multiprocessing `
            --hidden-import socket `
            --hidden-import ssl `
            --hidden-import email `
            --hidden-import email.mime `
            --hidden-import email.mime.multipart `
            --hidden-import email.mime.text `
            --hidden-import aiohttp `
            --hidden-import aiohttp.client `
            --hidden-import pyotp `
            --hidden-import qrcode `
            --hidden-import base64 `
            --collect-all uvicorn `
            --collect-all starlette `
            --collect-all fastapi `
            --collect-all pydantic `
            --collect-all pydantic_core `
            --collect-all bs4 `
            --collect-all anyio `
            --collect-all aiohttp `
            server.py

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item .servercraft-build/backend/dist/ServerCraft.exe release/
          
          # Create launcher batch file that captures errors
          $launcher = "@echo off`r`n"
          $launcher += "title ServerCraft - Windows Edition`r`n"
          $launcher += "echo ============================================`r`n"
          $launcher += "echo   ServerCraft - Windows Edition`r`n"
          $launcher += "echo   Version: 1.6.2026.0C`r`n"
          $launcher += "echo ============================================`r`n"
          $launcher += "echo.`r`n"
          $launcher += "echo Starting ServerCraft...`r`n"
          $launcher += "echo.`r`n"
          $launcher += "ServerCraft.exe`r`n"
          $launcher += "echo.`r`n"
          $launcher += "echo ============================================`r`n"
          $launcher += "if errorlevel 1 (`r`n"
          $launcher += "    echo   ERROR: ServerCraft crashed!`r`n"
          $launcher += "    echo   Exit code: %errorlevel%`r`n"
          $launcher += ") else (`r`n"
          $launcher += "    echo   ServerCraft has stopped.`r`n"
          $launcher += ")`r`n"
          $launcher += "echo ============================================`r`n"
          $launcher += "echo.`r`n"
          $launcher += "pause`r`n"
          $launcher | Out-File -Encoding ASCII release/Start-ServerCraft.bat
          
          # Create README
          $readme = "# ServerCraft - Windows Edition`r`n`r`n"
          $readme += "## Quick Start`r`n"
          $readme += "1. Double-click Start-ServerCraft.bat (recommended)`r`n"
          $readme += "   OR ServerCraft.exe directly`r`n"
          $readme += "2. Browser opens to http://localhost:8001`r`n`r`n"
          $readme += "## Troubleshooting`r`n"
          $readme += "If the app crashes, run Start-ServerCraft.bat to see errors.`r`n`r`n"
          $readme += "## System Requirements`r`n"
          $readme += "- Windows 10/11 or Server 2019+`r`n"
          $readme += "- Minimum: 4 cores, 8GB RAM`r`n"
          $readme += "- Recommended: 8+ cores, 32GB RAM`r`n`r`n"
          $readme += "Copyright 2026 TierOne Development"
          $readme | Out-File -Encoding UTF8 release/README.txt

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath ServerCraft-Windows-Portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerCraft-Windows-Portable
          path: ServerCraft-Windows-Portable.zip
